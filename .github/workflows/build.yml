name: Build ROM

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - name: Install python3 + Pillow
        run: |
          apt-get update && \
          apt-get install -y --no-install-recommends python3 python3-pil && \
          apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/*

      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: slavic2026.nds
          path: slavic2026.nds
