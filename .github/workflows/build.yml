name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build NDS ROM
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:dev-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: slavic2026.nds
          path: slavic2026.nds
          if-no-files-found: error
