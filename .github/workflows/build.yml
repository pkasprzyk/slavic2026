name: Build ROM

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - name: Install deps (NFLib, python3, Pillow, gh)
        run: |
          wf-pacman -S --noconfirm blocksds-nflib && \
          wf-config clean-caches --all && \
          apt-get update && \
          apt-get install -y --no-install-recommends python3 python3-pil gh && \
          apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/* && \
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: slavic2026.nds
          path: slavic2026.nds

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gh release create "build-${{ github.run_number }}" \
            slavic2026.nds \
            --title "Build #${{ github.run_number }}" \
            --notes "$(git log -1 --format='%h %s')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep 10)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gh release list --limit 999 --json tagName --jq '.[].tagName' | \
            tail -n +11 | while read tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
