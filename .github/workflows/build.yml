name: Build + Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - name: Install deps
        run: |
          wf-pacman -S --noconfirm blocksds-nflib && \
          wf-config clean-caches --all && \
          apt-get update && \
          apt-get install -y --no-install-recommends python3 python3-pil gh && \
          apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/* && \
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: git pull --rebase origin master

      - name: Read + bump version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VER=$(cat VERSION)
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(( $(echo "$VER" | cut -d. -f3) + 1 ))
          echo "version=v$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Build
        run: make

      - name: Rename ROM with version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cp slavic2026.nds "slavic2026-${{ steps.version.outputs.version }}.nds"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: slavic2026${{ steps.version.outputs.version || '' }}
          path: slavic2026*.nds

      - name: Push tag
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          TAG="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG exists, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "${TAG#v}" > VERSION
          git add VERSION
          git commit -m "bump version to $TAG [skip ci]"
          git tag "$TAG"
          git push origin master --tags

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.push.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "slavic2026-${{ steps.version.outputs.version }}.nds" \
            slavic2026.nds \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$(git log -1 --format='%h %s' | head -1)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep 10)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gh release list --limit 999 --json tagName --jq '.[].tagName' | \
            tail -n +11 | while read tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir pages
          cp slavic2026*.nds pages/
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Chilling Mech</title>
          <style>body{font-family:monospace;max-width:600px;margin:40px auto;padding:0 20px;background:#111;color:#eee}a{color:#5af}</style>
          </head><body>
          <h1>Chilling Mech</h1>
          <p><a href="slavic2026.nds">Download latest build</a></p>
          <p><small>${{ steps.version.outputs.version }} &mdash; $(git log -1 --format='%h %s' | head -1)</small></p>
          </body></html>
          EOF

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          enable_jekyll: false
